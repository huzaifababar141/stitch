name: CI/CD Staging Pipeline

on:
  push:
    branches: [ "staging" ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci || npm install
        
      - name: Run Linter
        run: npm run lint --if-present
        
      - name: Run Type Check
        run: npx tsc --noEmit || echo "No tsc script"

  test:
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          
      - name: Start local Supabase
        run: supabase start
        
      - name: Copy env
        run: cp .env.local.example .env.local
        
      - name: Generate Prisma client
        run: npx prisma generate
        
      - name: Reset DB
        run: supabase db reset
        
      - name: Run Tests
        run: npm run test --if-present || echo "No tests yet"

  migrate-staging:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_STAGING_PROJECT_REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          
      - name: Link and Push Migrations
        run: |
          supabase link --project-ref $SUPABASE_STAGING_PROJECT_REF
          supabase db push

  deploy-staging:
    needs: migrate-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
        
      - name: Deploy to Vercel (Staging)
        run: vercel --token ${{ secrets.VERCEL_TOKEN }} --prod=false --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          
      - name: Health Check
        run: curl -sSf https://staging.yourdomain.pk/api/health || echo "Health check not available yet"

  comment-pr:
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Comment PR
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Staging deployment is successful! Check it at staging.yourdomain.pk'
            })
