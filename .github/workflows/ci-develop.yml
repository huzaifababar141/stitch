name: CI/CD Develop Pipeline

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci || npm install
        
      - name: Run Linter
        run: npm run lint --if-present
        
      - name: Run Type Check
        run: npx tsc --noEmit || echo "No type check script"
        
      - name: Run Prettier formatting check
        run: npx prettier --check . || echo "No prettier script"

  test:
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
          
      - name: Start local Supabase
        run: supabase start
        
      - name: Copy env
        run: cp .env.local.example .env.local
        
      - name: Generate Prisma client
        run: npx prisma generate
        
      - name: Reset DB (apply migrations & seed)
        run: supabase db reset
        
      - name: Run Tests
        run: npm run test --if-present || echo "No tests yet"
        
      - name: Stop Supabase
        if: always()
        run: supabase stop

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm ci || npm install
        
      - name: NPM Audit
        run: npm audit --audit-level=high || true
        
      - name: Gitleaks Scan
        uses: zricethezav/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
