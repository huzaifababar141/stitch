<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" fill="none">
  <!-- Background -->
  <rect width="200" height="320" fill="#FDF2F4" rx="16"/>
  
  <!-- Hair -->
  <ellipse cx="100" cy="48" rx="30" ry="28" fill="#4A2810"/>
  <rect x="70" y="48" width="60" height="30" rx="4" fill="#4A2810"/>
  <rect x="68" y="55" width="12" height="50" rx="6" fill="#4A2810"/>
  <rect x="120" y="55" width="12" height="50" rx="6" fill="#4A2810"/>
  
  <!-- Face -->
  <ellipse cx="100" cy="65" rx="22" ry="24" fill="#F4C09A"/>
  <!-- Eyes -->
  <ellipse cx="92" cy="60" rx="3" ry="3.5" fill="#2D1608"/>
  <ellipse cx="108" cy="60" rx="3" ry="3.5" fill="#2D1608"/>
  <!-- Eyebrows -->
  <path d="M88 54 Q92 51 96 53" stroke="#4A2810" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M104 53 Q108 51 112 54" stroke="#4A2810" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Nose -->
  <path d="M100 63 Q98 68 100 70 Q102 68 100 63" fill="#E8A876"/>
  <!-- Lips -->
  <path d="M94 75 Q100 79 106 75" stroke="#C0614A" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M94 75 Q100 73 106 75" stroke="#C0614A" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Neck -->
  <rect x="93" y="86" width="14" height="16" fill="#F4C09A"/>

  <!-- Dupatta / Shawl over shoulder - decorative -->
  <path d="M65 100 Q50 110 45 140 Q42 170 50 210" stroke="#C44B72" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
  
  <!-- Kameez Body -->
  <path d="M72 100 L60 108 L55 140 L58 220 L142 220 L145 140 L140 108 L128 100 Z" fill="#D4547A"/>
  <!-- Kameez neckline -->
  <path d="M87 100 Q100 115 113 100" fill="#C03060" stroke="#C03060" stroke-width="1"/>
  <!-- Left sleeve -->
  <path d="M60 108 L42 140 L50 145 L72 115 Z" fill="#D4547A"/>
  <!-- Right sleeve -->
  <path d="M140 108 L158 140 L150 145 L128 115 Z" fill="#D4547A"/>
  <!-- Kameez hem detail -->
  <path d="M58 220 Q100 228 142 220" stroke="#C03060" stroke-width="1.5" fill="none"/>
  
  <!-- Embroidery on kameez -->
  <circle cx="100" cy="135" r="4" fill="#F4A0C0" opacity="0.7"/>
  <circle cx="90" cy="130" r="2.5" fill="#F4A0C0" opacity="0.6"/>
  <circle cx="110" cy="130" r="2.5" fill="#F4A0C0" opacity="0.6"/>
  <circle cx="95" cy="145" r="2" fill="#F4A0C0" opacity="0.5"/>
  <circle cx="105" cy="145" r="2" fill="#F4A0C0" opacity="0.5"/>
  
  <!-- Shalwar / Trouser -->
  <rect x="68" y="218" width="30" height="80" rx="4" fill="#B83060"/>
  <rect x="102" y="218" width="30" height="80" rx="4" fill="#B83060"/>
  <!-- Trouser separation line -->
  <rect x="97" y="218" width="6" height="40" fill="#A02050"/>
  
  <!-- Feet / Shoes -->
  <ellipse cx="83" cy="300" rx="15" ry="7" fill="#8B4513"/>
  <ellipse cx="117" cy="300" rx="15" ry="7" fill="#8B4513"/>
  
  <!-- Hands (visible at sleeve ends) -->
  <ellipse cx="46" cy="147" rx="7" ry="5" fill="#F4C09A"/>
  <ellipse cx="154" cy="147" rx="7" ry="5" fill="#F4C09A"/>
</svg>
